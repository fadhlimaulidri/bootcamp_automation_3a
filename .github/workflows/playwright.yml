name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    name: Run Playwright Test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: fadhlimaulidri/bootcamp_automation_3a:base
    steps:
     - name: Checkout Repository
       uses: actions/checkout@v4

     - name: Install dependencies
       run: npm ci

     - name: Install Playwright Browsers
       run: npx playwright install --with-deps chromium
       env:
         PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

     - name: Run Playwright tests
       run: npx playwright test --grep "@staging"
       env:
         PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
         BASE_URL: https://www.emra.chat
         WORKER: 3
         RETRY: 0
         HEADLESS: true
         AGENTQ_PROJECT_ID: ${{ vars.AGENTQ_PROJECT_ID }}
         AGENTQ_TESTRUN_ID: ${{ vars.AGENTQ_TESTRUN_ID }}
         AGENTQ_EMAIL: ${{ vars.AGENTQ_EMAIL }}
         AGENTQ_PASSWORD: ${{ secrets.AGENTQ_PASSWORD }}
     - uses: actions/upload-artifact@v4
       if: ${{ !cancelled() }}
       with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
